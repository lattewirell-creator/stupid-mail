[package]
name = "stupid-mail"
version = "2.8.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
ed25519-dalek = "3.0.0"
encoding_rs = "0.8.42"
include_dir = "0.7.4"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "native-tls", "builder"] }
muda = "0.21.2"
native-tls = "0.2.18"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tao = "0.37.1"
ureq = "3.4.2"
uuid = { version = "1.28.0", features = ["v4"] }
wry = "0.57.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1.34"
